palette = "dracula"
add_newline = true
format = "$username$hostname$directory$git_branch$git_status$python$cmd_duration$line_break$character"

[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"

[username]
show_always = true
style_user = "bold pink"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold cyan"
format = "[@$hostname]($style) "

[directory]
style = "bold purple"
read_only = " 󰌾"
truncation_length = 3

[git_branch]
symbol = " "
style = "bold green"

[git_status]
style = "bold orange"

[python]
symbol = " "
style = "bold yellow"

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
