set -g mouse on
set -g default-terminal "foot"
set -ga terminal-overrides ",foot:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g status-position top

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'

set -g @dracula-plugins "custom:deck-status.sh time"
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-refresh-rate 5
set -g @dracula-military-time true

set -g @dracula-custom-plugin-colors "pink dark_gray"

set -g @dracula-left-icon-padding 1
set -g @dracula-show-flags true
set -g @dracula-cpu-display-load false
set -g @dracula-ram-usage-label "MEM"
set -g @dracula-cpu-usage-label "CPU"

set -g @dracula-show-left-sep ""
set -g @dracula-show-right-sep ""
set -g @dracula-show-left-sep ""
set -g @dracula-show-right-sep ""
set-hook -g after-split-window 'set -w pane-border-status off'
set-hook -g pane-exited 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status bottom"'
set -g status-interval 5
set -g @dracula-time-format '%a %d %b %H:%M'
run '~/.tmux/plugins/tpm/tpm'

# Footer (after the Dracula plugin so it isn't overridden)
set -g pane-border-status bottom
set -g pane-border-style "fg=#44475a,bg=#44475a"
set -g pane-active-border-style "fg=#44475a,bg=#44475a"
set -g pane-border-format "#[align=right]#(~/bin/deck-footer.sh)"
bind a select-window -t :apps

# Accent color from deck settings (must stay last)
set -g prefix2 F1
source-file -q ~/.config/deck/accent.tmux
